<div class="topbar">
  <p class="topbar-text">
    Ваша філія: <span class="topbar-current">{{ currentBranchLabel }}</span>
    <a href="#" data-href="{{ otherBranchHref }}" class="topbar-switch-link">
      Інша філія: {{ otherBranchLabel }}
    </a>
  </p>
</div>
<header class="header" data-aos="fade-down">
  <div class="container header-container">
    <a
      href="/"
      class="logo header-logo"
      aria-label="Go to main page"
    >
      <img
        class="logo-img"
        srcset="./img/logo-225.webp 225w, ./img/logo-300.webp 300w"
        src="./img/logo-mega-min.webp"
        sizes="(min-width: 1280px) 150px, (min-width: 768px) 150px, 150px"
        alt="car"
        width="150"
        height="55"
      />
    </a>
    <ul class="header-oder-list">
      <li class="order-item">
        <button
          class="order-btn"
          type="button"
          data-modal-order-open
          data-title="call"
        >
          Замовити дзвінок
        </button>
      </li>
      <li class="order-item">
        <button class="order-btn" type="button" data-modal-order-open>
          Записатись on-line
        </button>
      </li>
    </ul>
    <include src="./partials/social-links.html"></include>
    <address class="header-contacts">
      <if condition="phone">
        <a href="tel:{{ phone }}" class="header-tel">{{ phoneDisplay }}</a>
      </if>
      <if condition="mapsLink">
        <a target="_blank" href="{{ mapsLink }}" class="header-location">
          {{ address }}</a
        >
      </if>
      <else>
        <span class="header-location">{{ address }}</span>
      </else>
    </address>
  </div>
</header>
