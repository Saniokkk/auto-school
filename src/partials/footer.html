<footer class="footer">
  <div class="container footer-container">
    <div class="footer-wrap">
      <a
        href="/"
        class="logo footer-logo"
        aria-label="Go to main page"
        ><img
          class="logo-img"
          src="./img/logo-mega-min.webp"
          alt=""
          width="150"
          height="55"
      /></a>
      <include src="./partials/social-links.html"></include>
      <div class="footer-right-wrap">
        <address class="footer-contacts">
          <if condition="phone">
            <a href="tel:{{ phone }}" class="footer-tel">{{ phoneDisplay }}</a>
          </if>
          <if condition="mapsLink">
            <a target="_blank" href="{{ mapsLink }}" class="footer-location">
              {{ address }}</a
            >
          </if>
          <else>
            <span class="footer-location">{{ address }}</span>
          </else>
        </address>
        <ul class="footer-oder-list">
          <li class="order-item">
            <button
              class="order-btn"
              type="button"
              data-modal-order-open
              data-title="call"
            >
              Замовити дзвінок
            </button>
          </li>
          <li class="order-item">
            <button class="order-btn" type="button" data-modal-order-open>
              Записатись on-line
            </button>
          </li>
        </ul>
      </div>
    </div>
    <div class="branches-list">
      <h3 class="branches-title">Наші філії</h3>
      <ul class="branches-items">
        <each loop="branch in allBranches">
          <li class="branches-item">
            <a href="#" data-href="{{ branch.href }}" class="branches-link">{{ branch.label }}</a>
            <span class="branches-address">{{ branch.address }}</span>
            <if condition="branch.phoneDisplay">
              <a href="tel:{{ branch.phone }}" class="branches-phone">{{ branch.phoneDisplay }}</a>
            </if>
          </li>
        </each>
      </ul>
    </div>
    <div class="footer-wrap-social-links">
      <include src="./partials/social-links.html"></include>
    </div>
    <p class="footer-text">Всі права захищенні Автошкола «Драйвер» © 2023</p>
  </div>
</footer>
