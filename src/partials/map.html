<section class="section">
  <h2 class="visually-hidden">Автошкола {{ townName }}</h2>
  <div class="map-container">
    <div class="inner-map">
      <if condition="mapEmbedSrc">
        <iframe
          class="map-iframe"
          title="Як нас знайти на карті"
          id="map"
          src="{{ mapEmbedSrc }}"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </if>
      <else>
        <p class="map-iframe-placeholder">
          Карту філії додамо найближчим часом. Адреса філіалу зазначена поруч.
        </p>
      </else>
      <div class="about" id="about">
        <div class="about-inner-container" id="inner">
          <h2 class="about-title">Контакти</h2>
          <p class="about-text">
            <span class="about-text-accent">Запрошуємо</span> до нас на навчання
          </p>
          <p class="about-text">
            <span class="about-text-accent">Адреса:</span>
            <if condition="mapsLink">
              <a class="about-link" href="{{ mapsLink }}" target="_blank"
                >{{ address }}</a
              >
            </if>
            <else>
              <span class="about-link">{{ address }}</span>
            </else>
          </p>
          <if condition="phone">
            <p class="about-text">
              <span class="about-text-accent">Телефон:</span
              ><a class="about-link" href="tel:{{ phone }}">
                {{ phoneDisplay }}</a
              >
            </p>
          </if>
          <ul class="social-list">
            <li class="social-list-item">
              <a class="social-list-link" href="#"
                ><img
                  src="./img/instagram1.webp"
                  alt="icon instagram"
                  width="50"
                  height="50"
              /></a>
            </li>
            <li class="social-list-item">
              <a class="social-list-link" href="#"
                ><img
                  src="./img/facebook.webp"
                  alt="icon facebook"
                  width="50"
                  height="50"
              /></a>
            </li>
          </ul>
        </div>
        <button class="btn-phone" id="btn-phone">
          <img
            id="img-phone"
            class="img-phone"
            src="./img/phone-green.webp"
            alt="phone"
            width="50"
            height="50"
          />
        </button>
      </div>
    </div>
  </div>
</section>
